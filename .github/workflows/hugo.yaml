# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master

  # Rebuilds when the presentations repo notifies us (push to its main)
  repository_dispatch:
    types: [presentations-updated]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4

      # The Marp decks. Public repo, so the default token can read it.
      # Full history: sync-presentations.mjs dates decks by last commit.
      - name: Checkout presentations
        uses: actions/checkout@v4
        with:
          repository: ABeltramo/presentations
          path: presentations
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7

      - uses: reitzig/actions-asciidoctor@v2.0.2

      # Covers are downloaded once and kept in the Actions cache. They are
      # not in git: the build writes them to public/, and nothing else.
      - name: Restore cover cache
        uses: actions/cache@v4
        with:
          path: assets/covers
          key: covers-${{ hashFiles('data/books.yaml') }}
          restore-keys: |
            covers-

      - name: Fetch book covers
        run: node scripts/fetch-covers.mjs

      - name: Sync presentations data
        run: node scripts/sync-presentations.mjs --repo presentations

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo \
            --gc \
            --minify

      # --- Slides: build with Marp and mount under /presentations/ ---

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presentations/package-lock.json

      - name: Build slides
        working-directory: presentations
        run: |
          npm ci
          npm run build

      - name: Mount slides into the site
        run: |
          # Copy non-Markdown assets (images, fonts) next to the built decks
          find presentations/src -type f ! -name "*.md" | while read f; do
            dest="presentations/dist/${f#presentations/src/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
          # The Hugo section serves /presentations/; drop the Marp index
          rm -f presentations/dist/index.html
          mkdir -p public/presentations
          cp -R presentations/dist/. public/presentations/

      - name: Create legacy URL redirects
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          redirects = {
              "rh/asago/tech-meeting-07-10/slides.html": "../tech-meeting-26-10-07/slides.html",
              "rh/asago/tech-meeting-21-10/slides.html": "../tech-meeting-26-10-21/slides.html",
              "rh/asago/tech-meeting-04-11/slides.html": "../tech-meeting-26-11-04/slides.html",
          }

          for old_path, target in redirects.items():
              page = Path("public/presentations") / old_path
              page.parent.mkdir(parents=True, exist_ok=True)
              page.write_text("\n".join([
                  "<!doctype html>",
                  '<html lang="en">',
                  "<head>",
                  '  <meta charset="utf-8">',
                  f'  <meta http-equiv="refresh" content="0; url={target}">',
                  f'  <link rel="canonical" href="{target}">',
                  "<title>Presentation moved</title>",
                  "</head>",
                  "<body>",
                  f'  <p>This presentation moved. <a href="{target}">Open the updated presentation</a>.</p>',
                  "</body>",
                  "</html>",
              ]) + "\n")
              print(f"Redirect created: {old_path} -> {target}")
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

