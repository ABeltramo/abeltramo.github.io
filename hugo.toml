baseURL = 'https://abeltra.me/'
locale = 'en-us'
title = 'ABeltramo'
theme = "descent"

[params]

# the content sections the timeline shows
mainSections = ["writing"]

# the sentence on the summit
tagline = "Software, open source, and other things I find interesting."
# the line under the summit
description = "Posts, notes, slides and books, newest first."

# brand in the header, split on the dot
brand = "abeltra.me"

copyright = "© ABeltramo"

[params.author]
email = 'beltramo.ale@gmail.com'
name = 'ABeltramo'

[markup]
  [markup.highlight]
    # the theme carries its own token colours
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = true

  [markup.goldmark.renderer]
    unsafe = false

[menus]
[[menus.main]]
name = "Writing"
url = "/writing/"
weight = 10

[[menus.main]]
name = "Slides"
url = "/presentations/"
weight = 30

[[menus.main]]
name = "Books"
url = "/books/"
weight = 40

[[menus.main]]
name = "Github"
url = "https://github.com/ABeltramo"
weight = 50

[[menus.main]]
name = "RSS"
url = "/index.xml"
weight = 60

# Allow asciidoctor
[security]
[security.exec]
allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^npx$', '^postcss$', '^tailwindcss$', "^asciidoctor$"]

[outputs]
home = ['html', 'rss']
section = ['html', 'rss']
taxonomy = ['html']
term = ['html']
