{{/* Shared gradients. Defined once so every carabiner can use url(#cbMetal). */}}
<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="cbMetal" gradientUnits="userSpaceOnUse" x1="8" y1="16" x2="40" y2="66">
      <stop offset="0" stop-color="var(--metal-1)" />
      <stop offset="0.38" stop-color="var(--metal-2)" />
      <stop offset="0.62" stop-color="var(--metal-3)" />
      <stop offset="1" stop-color="var(--metal-4)" />
    </linearGradient>
    <linearGradient id="cbSleeve" gradientUnits="userSpaceOnUse" x1="31" y1="0" x2="39" y2="0">
      <stop offset="0" stop-color="var(--sleeve-1)" />
      <stop offset="0.5" stop-color="var(--sleeve-2)" />
      <stop offset="1" stop-color="var(--sleeve-3)" />
    </linearGradient>
  </defs>
</svg>
